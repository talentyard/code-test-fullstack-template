name: Tests

on:
  pull_request:
    branches: ["main"]

jobs:
  backend-tests:
    name: Backend (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test -- --passWithNoTests
